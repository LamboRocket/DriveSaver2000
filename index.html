<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Video Recorder</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
/>

<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

#app {
  padding: 20px;
  max-width: 500px;
  margin: 0 auto;
}

h1 {
  font-size: 24px;
  margin-bottom: 5px;
}

.sub {
  font-size: 14px;
  color: #666;
  margin-bottom: 20px;
}

#video-preview {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#preview {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.placeholder {
  color: #999;
  text-align: center;
  padding: 30px;
}

.placeholder i {
  font-size: 50px;
  display: block;
  margin-bottom: 10px;
}

.rec-dot {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 12px;
  height: 12px;
  background: red;
  border-radius: 50%;
  display: none;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.timer {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.btn {
  flex: 1;
  border: none;
  border-radius: 12px;
  padding: 13px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}

.btn.primary {
  background: #007aff;
  color: white;
}

.btn.danger {
  background: #ff3b30;
  color: white;
}

.btn.secondary {
  background: white;
  border: 1px solid #ddd;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.status-card {
  background: white;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
  font-size: 14px;
}

.status-card.success {
  background: #dff6dd;
  color: #157347;
}

.status-card.error {
  background: #ffe2e2;
  color: #b42318;
}

.status-card.info {
  background: #dbeafe;
  color: #1d4ed8;
}

.config-section {
  background: white;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 16px;
}

.config-label {
  font-size: 13px;
  margin-bottom: 6px;
  color: #666;
}

input[type=text] {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  margin-bottom: 12px;
}

.recordings-list {
  margin-top: 10px;
}

.rec-item {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
}

.rec-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.rec-name {
  font-size: 14px;
  font-weight: 600;
}

.rec-size {
  font-size: 12px;
  color: #666;
}

.rec-buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.small-btn {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  font-size: 13px;
}

.download-btn {
  background: #f2f2f2;
}

.upload-btn {
  background: #007aff;
  color: white;
}

.upload-btn:disabled {
  opacity: 0.5;
}

#setup-note {
  background: white;
  border-radius: 12px;
  padding: 15px;
  font-size: 13px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div id="app">

  <h1>
    <i class="ti ti-video"></i>
    Video Recorder
  </h1>

  <p class="sub">
    Record horizontal MP4 videos & upload to Google Drive
  </p>

  <div id="video-preview">

    <div class="placeholder" id="placeholder">
      <i class="ti ti-camera-off"></i>
      Tap "Start Camera"
    </div>

    <video
      id="preview"
      autoplay
      muted
      playsinline
      webkit-playsinline
    ></video>

    <div class="rec-dot" id="rec-dot"></div>

    <div class="timer" id="timer">
      0:00
    </div>

  </div>

  <div class="controls">

    <button class="btn secondary" id="btn-camera">
      <i class="ti ti-camera"></i>
      Start Camera
    </button>

    <button class="btn primary" id="btn-record" disabled>
      <i class="ti ti-circle" id="rec-icon"></i>
      <span id="rec-label">Record</span>
    </button>

  </div>

  <div id="status-area"></div>

  <div class="config-section">

    <div class="config-label">
      Google OAuth Client ID
    </div>

    <input
      type="text"
      id="client-id"
      placeholder="Paste your Google OAuth Client ID"
    />

    <div class="config-label">
      Google API Key
    </div>

    <input
      type="text"
      id="api-key"
      placeholder="Paste your Google API Key"
    />

    <button class="btn secondary" id="pick-folder-btn">
      <i class="ti ti-folder"></i>
      Choose Drive Folder
    </button>

  </div>

  <div id="recordings-section" style="display:none">

    <h3 style="margin-bottom:10px;">
      Recorded Videos
    </h3>

    <div class="recordings-list" id="recordings-list"></div>

  </div>

  <div id="setup-note">
    <strong>Google Setup:</strong><br><br>

    Enable:
    <br>
    • Google Drive API
    <br>
    • Google Picker API
    <br><br>

    Create:
    <br>
    • OAuth Client ID
    <br>
    • API Key
  </div>

</div>

<script>

let stream = null;
let mediaRecorder = null;
let chunks = [];
let recordings = [];

let seconds = 0;
let timerInterval = null;
let isRecording = false;

let accessToken = null;
let tokenClient = null;
let selectedFolderId = null;

function showStatus(msg, type='info') {

  document.getElementById('status-area').innerHTML =
  `
    <div class="status-card ${type}">
      ${msg}
    </div>
  `;
}

function formatTime(sec) {

  const m = Math.floor(sec / 60);
  const s = sec % 60;

  return `${m}:${s.toString().padStart(2, '0')}`;
}

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        aspectRatio: 16 / 9
      },

      audio: {
        echoCancellation: true,
        noiseSuppression: true
      }
    });

    const preview = document.getElementById('preview');

    preview.srcObject = stream;

    preview.style.display = 'block';

    document.getElementById('placeholder').style.display = 'none';

    document.getElementById('btn-camera').disabled = true;

    document.getElementById('btn-record').disabled = false;

    if (screen.orientation?.lock) {

      try {
        await screen.orientation.lock('landscape');
      } catch(e) {}
    }

    showStatus(
      'Camera ready.',
      'success'
    );

  } catch(err) {

    console.error(err);

    showStatus(
      'Camera access denied.',
      'error'
    );
  }
}

function startRecording() {

  chunks = [];

  let mimeType = '';

  if (
    MediaRecorder.isTypeSupported(
      'video/mp4;codecs=h264,aac'
    )
  ) {

    mimeType = 'video/mp4;codecs=h264,aac';

  } else if (
    MediaRecorder.isTypeSupported(
      'video/mp4'
    )
  ) {

    mimeType = 'video/mp4';

  } else {

    showStatus(
      'MP4 recording not supported.',
      'error'
    );

    return;
  }

  mediaRecorder = new MediaRecorder(stream, {

    mimeType,
    videoBitsPerSecond: 8000000

  });

  mediaRecorder.ondataavailable = (e) => {

    if (e.data.size > 0) {

      chunks.push(e.data);
    }
  };

  mediaRecorder.onstop = saveRecording;

  mediaRecorder.start(1000);

  isRecording = true;

  seconds = 0;

  document.getElementById('rec-dot').style.display = 'block';

  document.getElementById('timer').style.display = 'block';

  document.getElementById('rec-icon').className = 'ti ti-square';

  document.getElementById('rec-label').textContent = 'Stop';

  document.getElementById('btn-record').classList.remove('primary');

  document.getElementById('btn-record').classList.add('danger');

  timerInterval = setInterval(() => {

    seconds++;

    document.getElementById('timer').textContent =
      formatTime(seconds);

  }, 1000);

  showStatus(
    'Recording...',
    'info'
  );
}

function stopRecording() {

  mediaRecorder.stop();

  clearInterval(timerInterval);

  isRecording = false;

  document.getElementById('rec-dot').style.display = 'none';

  document.getElementById('rec-icon').className = 'ti ti-circle';

  document.getElementById('rec-label').textContent = 'Record';

  document.getElementById('btn-record').classList.remove('danger');

  document.getElementById('btn-record').classList.add('primary');
}

function toggleRecord() {

  if (!isRecording) {

    startRecording();

  } else {

    stopRecording();
  }
}

function saveRecording() {

  const blob = new Blob(chunks, {
    type: 'video/mp4'
  });

  const defaultName =
    `video_${new Date()
      .toISOString()
      .replace(/[:.]/g, '-')}`;

  const customName =
    prompt(
      'Rename your video:',
      defaultName
    );

  const name =
    (customName || defaultName) + '.mp4';

  const url = URL.createObjectURL(blob);

  const size =
    (blob.size / (1024 * 1024))
      .toFixed(1) + ' MB';

  recordings.unshift({

    name,
    blob,
    url,
    size,
    uploaded: false

  });

  renderRecordings();

  document.getElementById(
    'recordings-section'
  ).style.display = 'block';

  showStatus(
    'Recording saved.',
    'success'
  );
}

function renderRecordings() {

  const list =
    document.getElementById('recordings-list');

  list.innerHTML =
    recordings.map((r, index) => {

      return `
        <div class="rec-item">

          <div class="rec-row">

            <div>

              <div class="rec-name">
                ${r.name}
              </div>

              <div class="rec-size">
                ${r.size}
              </div>

            </div>

          </div>

          <div class="rec-buttons">

            <a
              href="${r.url}"
              download="${r.name}"
              class="small-btn download-btn"
              style="
                text-align:center;
                text-decoration:none;
                color:black;
              "
            >
              Download
            </a>

            <button
              class="small-btn upload-btn"
              onclick="uploadToDrive(${index})"
              ${r.uploaded ? 'disabled' : ''}
            >

              ${
                r.uploaded
                ? 'Uploaded'
                : 'Upload to Drive'
              }

            </button>

          </div>

        </div>
      `;
    }).join('');
}

function initializeGoogle() {

  const clientId =
    document.getElementById('client-id').value.trim();

  const apiKey =
    document.getElementById('api-key').value.trim();

  if (!clientId || !apiKey) {

    showStatus(
      'Paste Client ID and API Key first.',
      'error'
    );

    return false;
  }

  gapi.load('picker');

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: clientId,

      scope:
        'https://www.googleapis.com/auth/drive.file',

      callback: ''

    });

  return true;
}

function pickDriveFolder() {

  if (!initializeGoogle()) return;

  tokenClient.callback = async (resp) => {

    accessToken = resp.access_token;

    const view =
      new google.picker.DocsView(
        google.picker.ViewId.FOLDERS
      )
      .setIncludeFolders(true)
      .setSelectFolderEnabled(true);

    const picker =
      new google.picker.PickerBuilder()

      .addView(view)

      .setOAuthToken(accessToken)

      .setDeveloperKey(
        document.getElementById('api-key').value.trim()
      )

      .setCallback(folderPicked)

      .build();

    picker.setVisible(true);
  };

  tokenClient.requestAccessToken();
}

function folderPicked(data) {

  if (
    data.action === google.picker.Action.PICKED
  ) {

    selectedFolderId =
      data.docs[0].id;

    showStatus(
      `Folder selected: ${data.docs[0].name}`,
      'success'
    );
  }
}

async function uploadToDrive(index) {

  if (!selectedFolderId) {

    showStatus(
      'Choose a Drive folder first.',
      'error'
    );

    return;
  }

  const rec = recordings[index];

  showStatus(
    'Uploading...',
    'info'
  );

  const metadata = {

    name: rec.name,
    parents: [selectedFolderId]

  };

  const form = new FormData();

  form.append(
    'metadata',
    new Blob(
      [JSON.stringify(metadata)],
      { type: 'application/json' }
    )
  );

  form.append(
    'file',
    rec.blob
  );

  try {

    const response = await fetch(

      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',

      {

        method: 'POST',

        headers: {
          Authorization: `Bearer ${accessToken}`
        },

        body: form
      }
    );

    if (response.ok) {

      recordings[index].uploaded = true;

      renderRecordings();

      showStatus(
        'Upload complete.',
        'success'
      );

    } else {

      console.error(await response.text());

      showStatus(
        'Upload failed.',
        'error'
      );
    }

  } catch(err) {

    console.error(err);

    showStatus(
      'Upload failed.',
      'error'
    );
  }
}

document
  .getElementById('btn-camera')
  .addEventListener('click', startCamera);

document
  .getElementById('btn-record')
  .addEventListener('click', toggleRecord);

document
  .getElementById('pick-folder-btn')
  .addEventListener('click', pickDriveFolder);

</script>

</body>
</html>
