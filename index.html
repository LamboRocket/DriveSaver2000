<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Video Recorder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#f0f0f0;color:#111;font-family:Arial,sans-serif;}

/* ── PORTRAIT ── */
#app{
  display:flex;flex-direction:column;
  min-height:100dvh;
  padding:env(safe-area-inset-top,12px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}

#hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;background:#fff;border-bottom:1px solid #e0e0e0;
  flex-shrink:0;
}
#hdr h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
#gpill{
  font-size:12px;padding:6px 14px;border-radius:100px;
  border:1px solid #ddd;background:#f5f5f5;color:#555;cursor:pointer;
  white-space:nowrap;font-weight:600;
}
#gpill.on{background:#dff6dd;border-color:#157347;color:#157347;}

/* portrait: scrollable content below header */
#port-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:12px;}

/* viewfinder */
#vf{
  position:relative;background:#000;border-radius:14px;overflow:hidden;
  width:100%;flex-shrink:0;
}
/* 16:9 in portrait */
@media(orientation:portrait){
  #vf{padding-bottom:56.25%;}/* 9/16 */
  #vf>*{position:absolute;inset:0;}
}
#preview{width:100%;height:100%;object-fit:cover;display:block;}
#ph{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;pointer-events:none;
}
#ph i{font-size:48px;color:#555;}
#ph span{font-size:13px;color:#888;}
.rec-dot{
  position:absolute;top:12px;right:12px;
  width:12px;height:12px;border-radius:50%;background:red;
  display:none;animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.timer-badge{
  position:absolute;top:12px;left:12px;
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;
  padding:4px 10px;border-radius:20px;display:none;
}
#fmt-badge{
  position:absolute;bottom:10px;right:12px;
  background:rgba(0,0,0,.5);color:#ccc;font-size:11px;
  padding:3px 9px;border-radius:20px;
}

/* controls */
.controls{display:flex;gap:10px;}
.btn{
  flex:1;border:none;border-radius:12px;padding:13px;
  font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;
}
.btn:active{opacity:.75;}
.btn:disabled{opacity:.35;pointer-events:none;}
.btn.secondary{background:#fff;border:1px solid #ddd;color:#111;}
.btn.primary{background:#007aff;color:#fff;}
.btn.danger{background:#ff3b30;color:#fff;}

/* status */
.status-card{border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.5;}
.status-card.success{background:#dff6dd;color:#157347;}
.status-card.error{background:#ffe2e2;color:#b42318;}
.status-card.info{background:#dbeafe;color:#1d4ed8;}

/* config panel */
.panel{background:#fff;border-radius:14px;padding:14px;}
.panel-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.field-label{font-size:12px;color:#888;margin-bottom:4px;font-weight:600;}
.fw{margin-bottom:10px;}
.fw:last-child{margin-bottom:0;}
input[type=text]{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid #ddd;
  font-size:14px;background:#fafafa;
}
input[type=text]:focus{outline:none;border-color:#007aff;}

/* folder buttons */
#folder-btns{display:flex;flex-direction:column;gap:8px;}
.folder-btn{
  width:100%;padding:11px 14px;border-radius:10px;
  border:1px solid #ddd;background:#fafafa;
  font-size:14px;font-weight:600;cursor:pointer;
  text-align:left;display:flex;align-items:center;gap:8px;
  transition:all .15s;
}
.folder-btn:active{background:#f0f0f0;}
.folder-btn.selected{background:#007aff;color:#fff;border-color:transparent;}
.folder-btn i{font-size:16px;flex-shrink:0;}
#folder-hint{font-size:12px;color:#888;margin-top:6px;}
#load-folders-btn{
  width:100%;padding:10px;border-radius:10px;
  border:1px solid #ddd;background:#f5f5f5;color:#555;
  font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;
}
#load-folders-btn:active{background:#e8e8e8;}

/* recordings */
.rec-item{background:#fff;border-radius:12px;padding:13px;border:1px solid #e8e8e8;}
.rec-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec-size{font-size:12px;color:#888;margin-top:2px;}
.rec-btns{display:flex;gap:8px;margin-top:10px;}
.small-btn{
  flex:1;border:none;border-radius:10px;padding:10px;
  cursor:pointer;font-size:13px;font-weight:700;
  text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;
}
.small-btn:active{opacity:.7;}
.download-btn{background:#f0f0f0;color:#111;}
.rename-btn{background:#f0f0f0;color:#111;}
.upload-btn{background:#007aff;color:#fff;}
.upload-btn:disabled{opacity:.4;pointer-events:none;}
.uploaded-btn{background:#dff6dd;color:#157347;}
.rename-row{display:flex;gap:6px;margin-top:8px;}
.rename-row input{flex:1;margin:0;padding:8px 10px;font-size:13px;}
.rn-ok{padding:8px 14px;border-radius:10px;border:none;background:#007aff;color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
.rn-x{padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#555;font-size:13px;cursor:pointer;}
.empty-state{text-align:center;font-size:13px;color:#888;padding:20px 0;}

/* ── LANDSCAPE ── */
@media(orientation:landscape){
  #app{flex-direction:column;} /* keep header full width */

  /* body becomes side-by-side */
  #port-body{
    flex-direction:row;
    overflow:hidden;
    padding:0;
    gap:0;
  }

  /* left: viewfinder, natural 16:9 height */
  #vf{
    padding-bottom:0 !important;
    height:100%;
    flex-shrink:0;
    border-radius:0;
    /* width set by JS = availH * 16/9 */
  }
  #vf>*{position:absolute;inset:0;}

  /* right: scrollable panel */
  #right-panel{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
    border-left:1px solid #e0e0e0;
    min-width:0;
  }
}
@media(orientation:portrait){
  #right-panel{display:contents;} /* children flow into #port-body */
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="hdr">
    <h1><i class="ti ti-video"></i> Video Recorder</h1>
    <button id="gpill" onclick="signIn()">Sign in to Google</button>
  </div>

  <!-- BODY -->
  <div id="port-body">

    <!-- VIEWFINDER -->
    <div id="vf">
      <video id="preview" autoplay muted playsinline></video>
      <div id="ph"><i class="ti ti-camera-off"></i><span>Tap Start Camera</span></div>
      <div class="rec-dot" id="rec-dot"></div>
      <div class="timer-badge" id="timer">0:00</div>
      <div id="fmt-badge">16:9</div>
    </div>

    <!-- RIGHT PANEL (landscape = aside, portrait = display:contents) -->
    <div id="right-panel">

      <!-- status -->
      <div id="status-area"></div>

      <!-- controls -->
      <div class="controls">
        <button class="btn secondary" id="btn-camera" onclick="startCamera()">
          <i class="ti ti-camera"></i> Start Camera
        </button>
        <button class="btn primary" id="btn-record" disabled onclick="toggleRecord()">
          <i class="ti ti-circle"></i> Record
        </button>
      </div>

      <!-- drive config -->
      <div class="panel">
        <div class="panel-title">Google Drive</div>
        <div class="fw">
          <div class="field-label">Client ID</div>
          <input type="text" id="client-id" placeholder="Paste your Client ID here" oninput="saveCid()"/>
        </div>
        <div class="fw">
          <div class="field-label">Subfolder in Entrevues</div>
          <div id="folder-btns"><div class="empty-state" style="padding:8px 0;">Sign in, then tap Load Folders</div></div>
          <div id="folder-hint"></div>
          <button id="load-folders-btn" onclick="loadFolders()">📁 Load Entrevues Folders</button>
        </div>
      </div>

      <!-- recordings -->
      <div class="panel" id="rec-panel" style="display:none;">
        <div class="panel-title">Recordings <span id="rec-cnt" style="font-weight:400;color:#aaa;"></span></div>
        <div id="recordings-list"></div>
      </div>

    </div><!-- /right-panel -->
  </div><!-- /port-body -->
</div><!-- /app -->

<script>
'use strict';

/* ── state ── */
let stream=null, mr=null, chunks=[], recs=[], recording=false;
let secs=0, timerInt=null, renIdx=null, gsiClient=null;
let tok=null, tokExp=0;
let selFid=null, selFname=null;

/* ── persist ── */
function saveCid(){ localStorage.setItem('vr_cid', document.getElementById('client-id').value); }
function loadCid(){ const v=localStorage.getItem('vr_cid'); if(v) document.getElementById('client-id').value=v; }
function saveTok(t,exp){ const e=Date.now()+((exp||3600)-60)*1000; localStorage.setItem('vr_tok',t); localStorage.setItem('vr_exp',String(e)); tok=t; tokExp=e; }
function loadTok(){ const t=localStorage.getItem('vr_tok'), e=parseInt(localStorage.getItem('vr_exp')||'0'); if(t&&e&&Date.now()<e){tok=t;tokExp=e;return true;} return false; }
function clearTok(){ localStorage.removeItem('vr_tok'); localStorage.removeItem('vr_exp'); tok=null; tokExp=0; }
function tokOk(){ return !!(tok && Date.now()<tokExp); }
function saveFolderPref(){ if(selFid) localStorage.setItem('vr_fid',selFid); if(selFname) localStorage.setItem('vr_fn',selFname); }
function loadFolderPref(){ selFid=localStorage.getItem('vr_fid')||null; selFname=localStorage.getItem('vr_fn')||null; }

/* ── status ── */
function showStatus(msg,type='info'){
  document.getElementById('status-area').innerHTML = msg
    ? `<div class="status-card ${type}">${msg}</div>` : '';
}

/* ── landscape: fix viewfinder width ── */
function fixVf(){
  const vf=document.getElementById('vf');
  const isLand=window.matchMedia('(orientation:landscape)').matches;
  if(isLand){
    const bodyH=document.getElementById('port-body').offsetHeight;
    vf.style.width=Math.floor(bodyH*16/9)+'px';
    vf.style.height=bodyH+'px';
  } else {
    vf.style.width='';
    vf.style.height='';
  }
}
window.addEventListener('resize',fixVf);
window.addEventListener('orientationchange',()=>setTimeout(fixVf,200));

/* ── camera ── */
async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}, aspectRatio:{ideal:16/9}},
      audio:{echoCancellation:true, noiseSuppression:true, sampleRate:44100}
    });
    const v=document.getElementById('preview');
    v.srcObject=stream;
    document.getElementById('ph').style.display='none';
    document.getElementById('btn-camera').disabled=true;
    document.getElementById('btn-record').disabled=false;
    localStorage.setItem('vr_cam','1');
    showStatus('Camera ready — press Record','success');
  } catch(err){
    showStatus('Camera denied: allow camera & mic in browser settings','error');
  }
}

/* ── recording ── */
function toggleRecord(){ recording ? stopRec() : startRec(); }

function getBestMime(){
  const list=[
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=h264,opus',
    'video/webm;codecs=vp9,opus',
    'video/webm'
  ];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}

function startRec(){
  if(!stream){ showStatus('Start camera first','error'); return; }
  chunks=[];
  const mime=getBestMime();
  try{ mr = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
  catch(e){ mr=new MediaRecorder(stream); }

  // Capture mime NOW — iOS Safari clears mr.mimeType after onstop fires
  const useMime = mr.mimeType || mime || 'video/mp4';

  mr.ondataavailable = e => { if(e.data && e.data.size>0) chunks.push(e.data); };
  // KEY FIX: wait 300ms after onstop so iOS delivers all chunks
  mr.onstop = () => setTimeout(()=>finalizeRec(useMime), 300);
  mr.onerror = e => showStatus('Recorder error','error');

  mr.start(500); // timeslice=500ms so we get chunks during recording
  recording=true; secs=0;

  document.getElementById('rec-dot').style.display='block';
  document.getElementById('timer').style.display='block';
  document.getElementById('fmt-badge').textContent=useMime.includes('mp4')?'MP4 · 16:9':'WebM · 16:9';
  document.getElementById('btn-record').className='btn danger';
  document.getElementById('btn-record').innerHTML='<i class="ti ti-square"></i> Stop';

  timerInt=setInterval(()=>{
    secs++;
    const m=Math.floor(secs/60), s=secs%60;
    document.getElementById('timer').textContent=`${m}:${s.toString().padStart(2,'0')}`;
  },1000);

  showStatus('Recording…','info');
}

function stopRec(){
  clearInterval(timerInt);
  // Request any buffered data before stopping
  try{ if(mr.state==='recording') mr.requestData(); }catch(e){}
  if(mr && mr.state!=='inactive') mr.stop();
  recording=false;
  document.getElementById('rec-dot').style.display='none';
  document.getElementById('timer').style.display='none';
  document.getElementById('btn-record').className='btn primary';
  document.getElementById('btn-record').innerHTML='<i class="ti ti-circle"></i> Record';
  showStatus('Processing video…','info');
}

function finalizeRec(mime){
  if(!chunks.length){ showStatus('No video data — try recording for longer','error'); return; }
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  let blob;
  try{ blob=new Blob(chunks,{type:mime}); }catch(e){ blob=new Blob(chunks); }
  if(!blob || blob.size<500){ showStatus('Video too small — try again','error'); return; }
  const name='video_'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const url=URL.createObjectURL(blob);
  const size=(blob.size/1048576).toFixed(1)+' MB';
  recs.unshift({name, ext, blob, url, size, uploaded:false});
  renderRecs();
  document.getElementById('rec-panel').style.display='block';
  showStatus('✓ Saved '+name+'.'+ext+' ('+size+'). Tap Upload to send to Drive.','success');
}

/* ── render recordings ── */
function renderRecs(){
  document.getElementById('rec-cnt').textContent='('+recs.length+')';
  const list=document.getElementById('recordings-list');
  if(!recs.length){ list.innerHTML='<div class="empty-state">No recordings yet.</div>'; return; }
  list.innerHTML=recs.map((r,i)=>{
    const isRen=renIdx===i;
    return `<div class="rec-item" id="ri-${i}" style="margin-bottom:${i<recs.length-1?'10px':'0'}">
      <div class="rec-name">${r.name}.${r.ext}</div>
      <div class="rec-size">${r.size} · ${r.ext.toUpperCase()}</div>
      ${isRen?`<div class="rename-row">
        <input type="text" id="rni-${i}" value="${r.name}">
        <button class="rn-ok" onclick="saveRename(${i})">Save</button>
        <button class="rn-x" onclick="cancelRename()">✕</button>
      </div>`:''}
      <div class="rec-btns">
        <a class="small-btn download-btn" href="${r.url}" download="${r.name}.${r.ext}">⬇ Download</a>
        <button class="small-btn rename-btn" onclick="startRename(${i})">✏ Rename</button>
        <button class="small-btn ${r.uploaded?'uploaded-btn':'upload-btn'}" onclick="uploadRec(${i})" ${r.uploaded?'disabled':''}>
          ${r.uploaded?'✓ Done':'☁ Upload'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function startRename(i){ renIdx=i; renderRecs(); setTimeout(()=>{ const el=document.getElementById('rni-'+i); if(el){el.focus();el.select();} },40); }
function saveRename(i){ const el=document.getElementById('rni-'+i); if(el){ const n=el.value.trim().replace(/[\/\\:*?"<>|]/g,'_'); if(n) recs[i].name=n; } renIdx=null; renderRecs(); }
function cancelRename(){ renIdx=null; renderRecs(); }

/* ── Google Sign-in (GIS — no redirect URI needed) ── */
function buildGsi(cid){
  gsiClient=google.accounts.oauth2.initTokenClient({
    client_id:cid,
    scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
    callback:resp=>{
      if(resp?.access_token){
        saveTok(resp.access_token, resp.expires_in);
        markSignedIn();
        showStatus('Signed in to Google ✓','success');
      } else {
        showStatus('Sign-in failed or cancelled','error');
      }
    },
    error_callback:err=>showStatus('Auth error: '+(err.message||'unknown'),'error')
  });
}

function markSignedIn(){
  const pill=document.getElementById('gpill');
  pill.textContent='✓ Google Connected';
  pill.classList.add('on');
}

function signIn(){
  const cid=document.getElementById('client-id').value.trim();
  if(!cid){ showStatus('Paste your Client ID first','error'); return; }
  saveCid();
  buildGsi(cid);
  gsiClient.requestAccessToken();
}

function silentRefresh(cid){
  if(!cid) return;
  try{
    google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
      prompt:'',
      callback:r=>{ if(r?.access_token){ saveTok(r.access_token,r.expires_in); markSignedIn(); } },
      error_callback:()=>{}
    }).requestAccessToken({prompt:''});
  }catch(e){}
}

/* ── Load Entrevues subfolders ── */
async function loadFolders(){
  if(!tokOk()){ showStatus('Sign in to Google first','error'); return; }
  const btn=document.getElementById('load-folders-btn');
  btn.textContent='Loading…'; btn.disabled=true;
  document.getElementById('folder-btns').innerHTML='<div class="empty-state" style="padding:8px 0;">Searching for Entrevues…</div>';
  document.getElementById('folder-hint').textContent='';

  try{
    // Step 1: find Entrevues folder across all drives
    const q1=`name='Entrevues' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r1=await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q1)}&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=allDrives`,
      {headers:{Authorization:`Bearer ${tok}`}}
    );
    const d1=await r1.json();
    if(!d1.files?.length){ showStatus('Entrevues folder not found. Make sure it\'s shared with your Google account.','error'); btn.textContent='📁 Load Entrevues Folders'; btn.disabled=false; return; }

    const entId=d1.files[0].id;

    // Step 2: get subfolders inside Entrevues
    const q2=`'${entId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r2=await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q2)}&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&orderBy=name&pageSize=100`,
      {headers:{Authorization:`Bearer ${tok}`}}
    );
    const d2=await r2.json();
    const subs=d2.files||[];

    // Always include root Entrevues folder as first option
    const allFolders=[{id:entId,name:'Entrevues (root)'}, ...subs];

    const container=document.getElementById('folder-btns');
    container.innerHTML=allFolders.map(f=>`
      <button class="folder-btn ${selFid===f.id?'selected':''}" id="fb-${f.id}" onclick="selectFolder('${f.id}','${f.name.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">
        <i class="ti ti-folder"></i> ${f.name}
      </button>
    `).join('');

    document.getElementById('folder-hint').textContent=
      subs.length ? `${subs.length} subfolder${subs.length!==1?'s':''} found inside Entrevues`
                  : 'No subfolders — will save to Entrevues root';

    // Auto-select saved preference
    if(selFid && allFolders.find(f=>f.id===selFid)){
      document.getElementById('fb-'+selFid)?.classList.add('selected');
    }

    showStatus('Folders loaded — tap one to select it','success');
  }catch(err){
    showStatus('Error loading folders: '+err.message,'error');
  }
  btn.textContent='📁 Reload Folders'; btn.disabled=false;
}

function selectFolder(id,name){
  selFid=id; selFname=name;
  saveFolderPref();
  // Highlight selected
  document.querySelectorAll('.folder-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('fb-'+id)?.classList.add('selected');
  showStatus('Folder set: '+name,'success');
}

/* ── Upload ── */
async function uploadRec(i){
  if(!tokOk()){ showStatus('Session expired — sign in again','error'); return; }
  if(!selFid){ showStatus('Select a folder first','error'); return; }
  const rec=recs[i];
  if(!rec?.blob||rec.blob.size===0){ showStatus('Video is empty','error'); return; }
  const fn=rec.name+'.'+rec.ext;
  showStatus('Uploading '+fn+'…','info');
  try{
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify({name:fn,parents:[selFid]})],{type:'application/json'}));
    form.append('file',rec.blob,fn);
    const res=await fetch(
      'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name&supportsAllDrives=true',
      {method:'POST',headers:{Authorization:`Bearer ${tok}`},body:form}
    );
    if(res.ok){
      recs[i].uploaded=true;
      renderRecs();
      showStatus('✓ Uploaded "'+fn+'" to '+selFname,'success');
    } else {
      const e=await res.json().catch(()=>({}));
      if(e.error?.code===401){ clearTok(); showStatus('Session expired — sign in again','error'); }
      else showStatus('Upload failed: '+(e.error?.message||res.status),'error');
    }
  }catch(err){ showStatus('Upload error: '+err.message,'error'); }
}

/* ── init ── */
window.addEventListener('load',()=>{
  loadCid();
  loadFolderPref();
  fixVf();

  if(loadTok()) markSignedIn();

  const cid=document.getElementById('client-id').value.trim();

  // Auto-start camera if previously allowed
  if(localStorage.getItem('vr_cam')==='1') startCamera();

  // Wait for GIS library then try silent token refresh
  const wait=setInterval(()=>{
    if(typeof google!=='undefined'&&google.accounts){
      clearInterval(wait);
      if(cid){ buildGsi(cid); if(!tokOk()) silentRefresh(cid); }
    }
  },300);
});
</script>
</body>
</html>
